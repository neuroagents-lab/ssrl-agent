# @package _global_

envs:
  task: 'dmc_walker_walk'
  eval_tasks: null
  backend: mjx
  mjx_actor_chunk: 1
  steps: 1.01e6
  env_num: 128
  eval_episode_num: 10
  eval_every: 50000
  update_log_every: 5000
  video_pred_log: False
  video_policy_log: True
  action_repeat: 1
  train_ratio: 512
  time_limit: 1000

  seed: ${seed}
  device: ${device}

  size: [64, 64]
  include_image: False
  # A common held-out reset bank is reused at every checkpoint and seed.
  eval_seed_offset: 1000000
  eval_seed_bank: [1000000, 1000001, 1000002, 1000003, 1000004,
                   1000005, 1000006, 1000007, 1000008, 1000009]
  encoder:
    mlp_keys: '.*'
    cnn_keys: '$^'
  decoder:
    mlp_keys: '.*'
    cnn_keys: '$^'

model:
  expl_behavior: "greedy"
  idm_type: "none"
