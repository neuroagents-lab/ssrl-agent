# @package _global_

defaults:
  - dmc_proprio
  - _self_

# Supervised from-scratch control matching native Walker Run adaptation.
envs:
  task: dmc_walker_run
  backend: dm_control
  protocol: standard
  env_num: 16
  include_proprio: true
  steps: 200000
  eval_every: 20000
  eval_action_selections: [greedy]
  video_policy_log: false
  video_pred_log: false

trainer:
  eval_action_selections: [greedy]

adaptation:
  enabled: false

model:
  eval_task_heads: false
  train_base_task_behavior: true
  strict_task_blind_pretraining: false
